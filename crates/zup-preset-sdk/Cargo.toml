[package]
name = "zup-preset-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/orielhaim/zup"
description = "Author a native GPUI installer preset for zup"
publish = true

[features]
# GPUI's headless test harness, for a preset that tests its own windows. Off by
# default, because a preset that never tests a window should not compile a test
# harness into its build.
test-support = ["gpui-kit/test-support"]

[dependencies]
zup-preset-ipc = { path = "../zup-preset-ipc", version = "0.1.0" }
zup-preset-protocol = { path = "../zup-preset-protocol", version = "0.1.0" }
zup-preset-sdk-macros = { path = "../zup-preset-sdk-macros", version = "0.1.0" }

# GPUI, re-exported so a preset project does not coordinate GPUI versions itself.
gpui-kit = "0.7"

# Settings are ordinary typed Rust. A preset applies
# `#[zup_sdk::preset::Settings]` rather than naming these crates: the schema
# that validates an application's settings is generated from the same types the
# preset deserializes into, so both have to be the versions this crate was built
# against. Two independently versioned copies of `schemars` are two schemas.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The channel a preset's drawing task reads the host through. An async receiver
# rather than a blocking one because the application owns the executor, and a
# preset that borrowed a runtime would tie the transport's lifetime to a window's.
futures-channel = "0.3"
futures-util = "0.3"

[dev-dependencies]
zup-sdk = { path = "../zup-sdk", version = "0.1.0", features = ["preset"] }
gpui-kit = { version = "0.7", features = ["test-support"] }
zup-preset-protocol = { path = "../zup-preset-protocol" }