[package]
name = "zup-publish-github"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GitHub Releases as a zup release provider"

[dependencies]
git-url-parse.workspace = true
reqwest.workspace = true
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
url = "2"
zup-acquire-http.workspace = true
zup-artifact.workspace = true
zup-core.workspace = true
zup-manifest.workspace = true
zup-publish.workspace = true

[dev-dependencies]
rstest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zup-acquire-http.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
