[package]
name = "zup-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared installer session controller for zup"

[features]
test-support = ["zup-preset-ipc/test-support"]

[[test]]
name = "controller"
required-features = ["test-support"]

[[bin]]
name = "close_preset"
required-features = ["test-support"]

[[bin]]
name = "install_preset"
required-features = ["test-support"]

[[bin]]
name = "install_close_preset"
required-features = ["test-support"]

[[bin]]
name = "protocol_fault_preset"
required-features = ["test-support"]

[[bin]]
name = "scope_install_preset"
required-features = ["test-support"]

[[bin]]
name = "uninstall_preset"
required-features = ["test-support"]

[[bin]]
name = "user_scope_install_preset"
required-features = ["test-support"]

[dependencies]
miette.workspace = true
opener.workspace = true
semver.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt", "sync", "macros"] }
zup-core.workspace = true
zup-exec.workspace = true
zup-plan.workspace = true
zup-platform.workspace = true
zup-presentation.workspace = true
zup-preset-host.workspace = true
zup-preset-ipc.workspace = true
zup-preset-protocol.workspace = true
zup-runtime.workspace = true
zup-transaction.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zup-bundle.workspace = true
