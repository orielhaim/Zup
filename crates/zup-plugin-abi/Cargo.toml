[package]
name = "zup-plugin-abi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/orielhaim/zup"
description = "The canonical WebAssembly component contract for zup plugins"
publish = true

# Cargo has no mechanism for one crate to hand a file path to another, so this
# crate publishes its WIT directory to crates that generate bindings from the
# contract. Without it a guest SDK would have to vendor a copy of the WIT, and
# two copies of an ABI are one divergence away from being two ABIs.
links = "zup_plugin_abi"
build = "build.rs"

[dependencies]
sha2.workspace = true