schema = 1

[app]
id = "com.acme.acme"
name = "Acme"
version = "1.4.0"
publisher = "Acme Inc."
main = "Acme.exe"

[build]

[build.targets.windows-x64]
target = "x86_64-pc-windows-msvc"
source = { directory = "dist" }

[install]
scope = "either"

[install.directory]
user = "${location.user_data}/Programs/${app.name}"
machine = "${location.programs}/${app.name}"

[[components]]
id = "core"
name = "Application"
required = true

[[components]]
id = "cli"
name = "Command-line tools"
default = true
requires = ["core"]
targets = ["windows-x64"]

[[components]]
id = "service"
name = "Background service"
default = false
requires = ["core"]

[[files]]
source = "**/*"
destination = "${install}"
component = "core"
targets = ["windows-x64"]

[[launchers]]
location = "menu"
name = "Acme"
target = "${install}/Acme.exe"
component = "core"

[[path]]
value = "${install}/bin"
component = "cli"

[[services]]
id = "acme-agent"
name = "acme-agent"
display_name = "Acme Agent"
binary = "${install}/acme-agent.exe"
start = "automatic"
component = "service"

[[protocols]]
scheme = "acme"
executable = "${install}/Acme.exe"
args = ["--url", "%1"]

[[file_associations]]
extension = ".acme"
id = "Acme.Document"
description = "Acme Document"
executable = "${install}/Acme.exe"
