[package]
name = "zup-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux backend for zup"
publish = false

[features]
# Test-only privileged-worker surface: isolated machine roots and a
# loopback elevation path for the machine-scope suite. Production binaries
# never enable this; the real worker always enforces the production roots,
# and no IPC message or environment variable selects them.
test-support = []

[dependencies]
rustix.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
typed-path.workspace = true
uuid.workspace = true
xdg.workspace = true
zup-artifact.workspace = true
zup-binary.workspace = true
zup-bundle.workspace = true
zup-core.workspace = true
zup-exec.workspace = true
zup-plan.workspace = true
zup-platform.workspace = true
zup-protocol.workspace = true
zup-transaction.workspace = true

[dev-dependencies]
rstest.workspace = true
semver.workspace = true
tempfile.workspace = true
zup-build.workspace = true
zup-bundle.workspace = true
zup-core.workspace = true
zup-exec.workspace = true
zup-manifest.workspace = true
zup-platform.workspace = true
zup-toolchain.workspace = true
zup-transaction.workspace = true

# The systemd manager integration is Linux-only: `zbus_systemd` does not
# compile for other targets (file-descriptor passing is Unix-only), and no
# portable or cross-platform crate may reach it (see the boundary verifier).
# Only the generated `systemd1` manager interface plus the Tokio integration
# the short-lived worker blocks on.
[target.'cfg(target_os = "linux")'.dependencies]
tokio.workspace = true
zbus_systemd.workspace = true