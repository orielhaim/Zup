[package]
name = "zup-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux backend for zup"
publish = false

[features]
test-support = ["dep:tempfile"]

[[bin]]
name = "test-gui-install-preset"
path = "src/bin/test_gui_install_preset.rs"
required-features = ["test-support"]

[[bin]]
name = "test-gui-close-preset"
path = "src/bin/test_gui_close_preset.rs"
required-features = ["test-support"]

[dependencies]
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
typed-path.workspace = true
uuid.workspace = true
xdg.workspace = true
zup-artifact.workspace = true
zup-binary.workspace = true
zup-bundle.workspace = true
zup-compose.workspace = true
zup-core.workspace = true
zup-exec.workspace = true
zup-plan.workspace = true
zup-platform.workspace = true
zup-preset-host.workspace = true
zup-preset-protocol.workspace = true
zup-protocol.workspace = true
zup-runtime.workspace = true
zup-session.workspace = true
zup-transaction.workspace = true

[dev-dependencies]
rstest.workspace = true
semver.workspace = true
tempfile.workspace = true
zup-build.workspace = true
zup-bundle.workspace = true
zup-core.workspace = true
zup-exec.workspace = true
zup-manifest.workspace = true
zup-platform.workspace = true
zup-runtime.workspace = true
zup-toolchain.workspace = true
zup-transaction.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
tokio.workspace = true
zbus_systemd.workspace = true
