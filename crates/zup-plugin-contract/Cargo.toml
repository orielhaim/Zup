[package]
name = "zup-plugin-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable WebAssembly component contract for zup plugins"

[features]
default = []
compiler = ["wasmtime/cranelift", "wasmtime/all-arch"]

[dependencies]
sha2.workspace = true
thiserror.workspace = true
wasmtime.workspace = true

[dev-dependencies]
rstest.workspace = true
wat = "1"
wit-component = { version = "=0.260.0", features = ["dummy-module"] }
wit-parser = "=0.260.0"
