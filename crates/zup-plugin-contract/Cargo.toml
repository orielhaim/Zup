[package]
name = "zup-plugin-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side WebAssembly engine and validation for zup plugins"
publish = false
build = "build.rs"

[features]
default = []
compiler = ["wasmtime/all-arch"]

[dependencies]
sha2.workspace = true
thiserror.workspace = true
wasmtime = { workspace = true, features = ["cranelift"] }
wasmtime-wasi.workspace = true
tokio.workspace = true
zup-plugin-abi.workspace = true

[dev-dependencies]
toml.workspace = true
zup-plugin-abi = { workspace = true, features = ["test-fixture"] }
rstest.workspace = true
wit-component.workspace = true
wit-parser.workspace = true
wat = "1"

[[test]]
name = "built_plugin"
required-features = ["compiler"]
