[package]
name = "zup-plugin-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side WebAssembly engine and validation for zup plugins"
publish = false
build = "build.rs"

[features]
default = []
# Ahead-of-time compilation, for the build host only. A machine that installs
# applications loads precompiled plugins and never needs a compiler.
compiler = ["wasmtime/cranelift", "wasmtime/all-arch"]

[dependencies]
sha2.workspace = true
thiserror.workspace = true
wasmtime.workspace = true
zup-plugin-abi.workspace = true

[dev-dependencies]
toml.workspace = true
zup-plugin-abi = { workspace = true, features = ["test-fixture"] }
rstest.workspace = true
wit-component.workspace = true
wit-parser.workspace = true
wat = "1"

[[test]]
name = "built_plugin"
required-features = ["compiler"]
