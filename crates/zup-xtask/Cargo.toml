[package]
name = "zup-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Package matrices, toolchain staging, and test inputs for zup"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
zup-plan.workspace = true
serde_json.workspace = true
cargo_metadata = "0.23"
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
zup-artifact.workspace = true
zup-automation = { workspace = true, features = ["bindings"] }
zup-binary.workspace = true
zup-core.workspace = true
zup-preset-protocol.workspace = true
zup-publish-github.workspace = true
zup-toolchain.workspace = true
zup-plugin-abi = { workspace = true, features = ["test-fixture"] }
zup-plugin-contract = { workspace = true, features = ["compiler"] }

[dev-dependencies]
rstest.workspace = true
