[package]
name = "zup-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Package matrices, toolchain staging, and test inputs for zup"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
zup-artifact.workspace = true
zup-automation = { workspace = true, features = ["bindings"] }
zup-binary.workspace = true
zup-core.workspace = true
zup-publish-github.workspace = true
zup-toolchain.workspace = true

[dev-dependencies]
rstest.workspace = true
