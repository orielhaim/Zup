[package]
name = "zup-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Package matrices, portable boundary checks, action pins, and test inputs for zup"
# Never a tool a user installs: this package exists to produce zup-owned build
# artifacts, and `cargo install` putting one on a PATH would make an internal
# component a product with no review in between.
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
semver.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
zup-automation = { workspace = true, features = ["bindings"] }
zup-artifact.workspace = true
zup-binary.workspace = true
zup-core.workspace = true
zup-publish-github.workspace = true
zup-toolchain.workspace = true

[dev-dependencies]
rstest.workspace = true
