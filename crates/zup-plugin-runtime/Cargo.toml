[package]
name = "zup-plugin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime-only WebAssembly plugin execution for zup"

[dependencies]
sha2.workspace = true
thiserror.workspace = true
wasmtime.workspace = true
zup-bundle.workspace = true
zup-core.workspace = true
zup-plan.workspace = true
zup-plugin-contract.workspace = true

[dev-dependencies]
semver.workspace = true
serde_json.workspace = true
tempfile.workspace = true
wat = "1"
wit-component = { version = "=0.259.0", features = ["dummy-module"] }
wit-parser = "=0.259.0"
zup-build.workspace = true
zup-plugin-contract = { workspace = true, features = ["compiler"] }
