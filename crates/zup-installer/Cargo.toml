[package]
name = "zup-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Installer and maintenance runtime embedded in a generated zup installer"
# This package exists to produce zup-owned build artifacts. It is never a tool a
# user installs; `zup` is the only installable CLI in the project.
publish = false

[features]
default = []
gui = []
console = ["dep:cliclack", "dep:console", "dep:indicatif"]
headless = []

[[bin]]
name = "zup-setup-gui"
path = "src/bin/zup-setup-gui.rs"
required-features = ["gui"]

[[bin]]
name = "zup-setup-console"
path = "src/bin/zup-setup-console.rs"
required-features = ["console"]

[[bin]]
name = "zup-setup-headless"
path = "src/bin/zup-setup-headless.rs"
required-features = ["headless"]

# The host is behind the `gui` feature, so a test that drives it belongs to that
# frontend. Naming the requirement rather than hiding the test is what keeps the
# console and headless builds honest: they are built with `--all-targets`, and a
# test that reached past their frontend would fail them for the wrong reason.
[[test]]
name = "preset_session"
required-features = ["gui"]

# Drives the GUI host through a real install, so it belongs to the GUI frontend
# for the same reason the session test does.
[[test]]
name = "preset_persistence"
required-features = ["gui"]

[dependencies]
clap = { workspace = true }
miette.workspace = true
opener.workspace = true
semver.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "sync",
  "signal",
] }
tokio-util = { version = "0.7", features = ["codec"] }
uuid.workspace = true
zup-acquire.workspace = true
zup-artifact.workspace = true
zup-bootstrap.workspace = true
zup-bundle.workspace = true
zup-core.workspace = true
zup-exec.workspace = true
zup-plan.workspace = true
zup-platform.workspace = true
zup-plugin-runtime.workspace = true
zup-presentation.workspace = true
zup-runtime.workspace = true
zup-transaction.workspace = true
zup-preset-host.workspace = true
zup-preset-protocol.workspace = true
zup-update.workspace = true
zup-windows.workspace = true
cliclack = { workspace = true, optional = true }
console = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
zup-plugin-abi = { workspace = true }
# The runtime's tests compose their own installer from a literal plan and a real
# staged runtime template. They do not depend on the build plane: a dev-dependency
# on the compiler that produces this package's artifacts would put the boundary
# this package exists to hold back into its own graph, and would let a runtime
# test keep passing if the boundary moved.
#
# `compiler` is the plugin *contract*'s Wasmtime compiler, needed so a test can
# produce a genuinely precompiled plugin rather than a stand-in for one. It is the
# contract crate, not the build plane, and it is a dev-dependency.
tempfile.workspace = true
rstest.workspace = true
wat = "1"
windows-registry.workspace = true
wit-component = { version = "=0.261", features = ["dummy-module"] }
wit-parser = "=0.261"
zup-plugin-contract = { workspace = true, features = ["compiler"] }
zup-toolchain.workspace = true
uuid.workspace = true
