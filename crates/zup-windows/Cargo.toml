[package]
name = "zup-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows backend for zup"

[features]
test-launcher = []

[[bin]]
name = "zup-test-worker"
path = "src/bin/test_worker.rs"
required-features = ["test-launcher"]

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing.workspace = true
uuid.workspace = true
windows-link.workspace = true
windows-registry.workspace = true
windows-result.workspace = true
lnks.workspace = true
windows-service.workspace = true
zup-bootstrap.workspace = true
zup-build.workspace = true
zup-bundle.workspace = true
zup-core.workspace = true
zup-exec.workspace = true
zup-plan.workspace = true
zup-platform.workspace = true
zup-acquire.workspace = true
zup-artifact.workspace = true
zup-pe.workspace = true
zstd.workspace = true
semver.workspace = true
zup-protocol.workspace = true
zup-runtime.workspace = true
zup-transaction.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_RestartManager",
  "Win32_System_SystemInformation",
] }

[build-dependencies]
windows-bindgen.workspace = true

[package.metadata.cargo-machete]
ignored = ["windows-bindgen"]

[dev-dependencies]
serde_json.workspace = true
zup-manifest.workspace = true
zup-plugin-contract.workspace = true
zup-xtask.workspace = true
