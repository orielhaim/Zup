[package]
name = "zup-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native GPUI frontend for zup installers and maintenance"

[dependencies]
gpui-kit = "0.6"
zup-core.workspace = true
zup-presentation.workspace = true
zup-runtime.workspace = true
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile.workspace = true
zup-platform.workspace = true
zup-transaction.workspace = true

[target.'cfg(windows)'.dev-dependencies]
zup-windows.workspace = true
