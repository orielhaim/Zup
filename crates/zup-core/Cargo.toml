[package]
name = "zup-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-independent installer engine primitives for zup"

[features]
default = []
# Deriving the JSON Schema is an authoring capability, not a domain one. The
# developer CLI turns it on; nothing the runtime links does, so an installer
# carries no schema machinery.
schema = ["dep:schemars"]

[dependencies]
base64.workspace = true
semver.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
target-lexicon.workspace = true
thiserror.workspace = true

[dev-dependencies]
rstest.workspace = true
serde_json.workspace = true
