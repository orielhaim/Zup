[package]
name = "zup-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/orielhaim/zup"
description = "Author a Zup installer preset or an installation plugin"
publish = true
build = "build.rs"

[features]
preset = [
    "dep:gpui-kit",
    "dep:zup-preset-protocol",
    "dep:zup-preset-ipc",
    "dep:zup-sdk-macros",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:futures-channel",
    "dep:futures-util",
]
plugin = ["dep:zup-plugin-abi", "dep:wit-bindgen"]
test-support = ["preset", "gpui-kit/test-support"]

[dependencies]
gpui-kit = { version = "0.7", optional = true }
zup-preset-protocol = { path = "../zup-preset-protocol", version = "0.1.0", optional = true }
zup-preset-ipc = { path = "../zup-preset-ipc", version = "0.1.0", optional = true }
zup-sdk-macros = { path = "../zup-sdk-macros", version = "0.1.0", optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
zup-plugin-abi = { path = "../zup-plugin-abi", version = "0.1.0", optional = true }
wit-bindgen = { version = "=0.62.0", optional = true }

[dev-dependencies]
serde_json = "1"
zup-preset-ipc = { path = "../zup-preset-ipc", version = "0.1.0" }
zup-preset-protocol = { path = "../zup-preset-protocol", version = "0.1.0" }

[package.metadata.docs.rs]
all-features = true
