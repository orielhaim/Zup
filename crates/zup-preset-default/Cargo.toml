[package]
name = "zup-preset-default"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The default native GPUI installer and maintenance preset for zup"
publish = false

[dependencies]
zup-ui-sdk.workspace = true
serde = { workspace = true, features = ["derive"] }
schemars.workspace = true
gpui-kit = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
