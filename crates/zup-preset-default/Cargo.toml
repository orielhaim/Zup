[package]
name = "zup-preset-default"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The default native GPUI installer and maintenance preset for zup"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
schemars.workspace = true
zup-sdk = { workspace = true, features = ["preset", "test-support"] }

[package.metadata.cargo-machete]
ignored = ["gpui-kit"]

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
