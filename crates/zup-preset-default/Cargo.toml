[package]
name = "zup-preset-default"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The default native GPUI installer and maintenance preset for zup"
publish = false

[dependencies]
zup-preset-sdk.workspace = true
serde = { workspace = true, features = ["derive"] }
schemars.workspace = true
gpui-kit = "0.7"

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
