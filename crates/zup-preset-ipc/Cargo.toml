[package]
name = "zup-preset-ipc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orielhaim/zup"
description = "Portable process transport for zup installer presets"
publish = true

[features]
test-launcher = []

[[bin]]
name = "zup-preset-ipc-test-preset"
path = "src/bin/test_preset.rs"
required-features = ["test-launcher"]

[dependencies]
zup-preset-protocol = { path = "../zup-preset-protocol", version = "0.1.0" }

ipc-channel = "0.23"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
