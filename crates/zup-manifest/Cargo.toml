[package]
name = "zup-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Authoring and configuration layer for zup"

[dependencies]
miette.workspace = true
semver.workspace = true
schemars.workspace = true
serde.workspace = true
# The generated schema's key order must not depend on which features happen to
# be enabled elsewhere in the build. `preserve_order` makes `serde_json::Value`
# keep insertion order — which is declaration order here, and the order a
# manifest is read in — instead of sorting keys, so a narrow and a full build
# emit the same bytes. Without it, the checked-in schema and CI's regenerated
# copy disagree on ordering alone.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_spanned.workspace = true
thiserror.workspace = true
toml.workspace = true
url.workspace = true
zup-core.workspace = true

[dev-dependencies]
rstest.workspace = true
