[package]
name = "zup-plugin-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Component and ahead-of-time compilation for zup plugins"
publish = false

[dependencies]
anyhow = "1"
# Componentization belongs to the build host, independent of author tooling.
wit-component = { version = "0.262", features = ["dummy-module"] }
wit-parser = "0.262"
zup-plugin-abi.workspace = true
zup-plugin-contract = { workspace = true, features = ["compiler"] }
sha2.workspace = true
thiserror.workspace = true
zup-bundle.workspace = true
zup-core.workspace = true

[dev-dependencies]
zup-build.workspace = true
tempfile.workspace = true
wat = "1"
zup-manifest.workspace = true