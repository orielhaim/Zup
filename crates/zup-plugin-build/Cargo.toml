[package]
name = "zup-plugin-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Component and ahead-of-time compilation for zup plugins"
publish = false

[dependencies]
anyhow = "1"
# Turning a plugin's core module into a component is Zup's step, not the
# author's, because the componentiser's version has to agree with the runtime
# that will load the result. It is pinned to the version the host was built
# against rather than discovered from whatever happens to be installed.
wit-component = { version = "=0.260.0", features = ["dummy-module"] }
wit-parser = "=0.260.0"
zup-plugin-abi.workspace = true
zup-plugin-contract = { workspace = true, features = ["compiler"] }
sha2.workspace = true
thiserror.workspace = true
zup-bundle.workspace = true
zup-core.workspace = true

[dev-dependencies]
zup-build.workspace = true
tempfile.workspace = true
wat = "1"
zup-manifest.workspace = true