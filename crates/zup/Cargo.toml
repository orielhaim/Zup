[package]
name = "zup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Developer-facing CLI for zup"
default-run = "zup"

[features]
default = []
build = [
  "dep:zup-build",
  "dep:zup-manifest",
  "dep:zup-plugin-build",
  "dep:clap_complete",
  "dep:inquire",
  "dep:serde_json",
  "dep:toml_edit",
]

[[bin]]
name = "zup"
path = "src/main.rs"
required-features = ["build"]

[[bin]]
name = "zup-setup"
path = "src/setup.rs"

[dependencies]
clap.workspace = true
clap_complete = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }
miette.workspace = true
serde_json = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
zup-windows.workspace = true
zup-build = { workspace = true, optional = true }
zup-bundle.workspace = true
zup-plugin-build = { workspace = true, optional = true }
zup-plugin-contract.workspace = true
zup-plugin-runtime.workspace = true
zup-core.workspace = true
zup-exec.workspace = true
zup-manifest = { workspace = true, optional = true }
zup-plan.workspace = true
zup-platform.workspace = true
zup-presentation.workspace = true
zup-runtime.workspace = true
zup-transaction.workspace = true
zup-update.workspace = true
zup-ui = { path = "../zup-ui" }
uuid.workspace = true
semver.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
base64 = "0.23.1"
tempfile.workspace = true
windows-registry.workspace = true
wit-component = { version = "=0.259.0", features = ["dummy-module"] }
wit-parser = "=0.259.0"
