[package]
name = "zup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Developer-facing CLI for zup"
default-run = "zup"

[features]
default = ["gui"]
build = [
  "dep:zup-build",
  "dep:zup-manifest",
  "dep:zup-plugin-build",
  "dep:zup-publish",
  "dep:zup-publish-github",
  "dep:zup-distribute-github",
  "dep:clap_complete",
  "dep:inquire",
  "dep:toml_edit",
  "dep:sha2",
]
gui = ["dep:zup-ui"]
console = ["dep:cliclack", "dep:console", "dep:indicatif"]
headless = []

[[bin]]
name = "zup"
path = "src/main.rs"
required-features = ["build"]

[[bin]]
name = "zup-setup"
path = "src/setup.rs"

[[bin]]
name = "zup-setup-gui"
path = "src/setup_gui.rs"
required-features = ["gui"]

[[bin]]
name = "zup-setup-console"
path = "src/setup_console.rs"
required-features = ["console"]

[[bin]]
name = "zup-setup-headless"
path = "src/setup_headless.rs"
required-features = ["headless"]

[dependencies]
clap.workspace = true
clap_complete = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit = { workspace = true, optional = true }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "sync",
  "signal",
] }
tokio-util = { version = "0.7", features = ["codec"] }
zup-windows.workspace = true
zup-pe.workspace = true
zup-build = { workspace = true, optional = true }
zup-bootstrap.workspace = true
zup-bundle.workspace = true
zup-acquire.workspace = true
zup-artifact.workspace = true
zup-plugin-build = { workspace = true, optional = true }
zup-plugin-contract.workspace = true
zup-plugin-runtime.workspace = true
zup-core.workspace = true
zup-exec.workspace = true
zup-manifest = { workspace = true, optional = true }
zup-plan.workspace = true
zup-platform.workspace = true
zup-presentation.workspace = true
zup-publish = { workspace = true, optional = true }
zup-publish-github = { workspace = true, optional = true }
zup-distribute-github = { workspace = true, optional = true }
zup-runtime.workspace = true
zup-transaction.workspace = true
zup-update.workspace = true
zup-ui = { path = "../zup-ui", optional = true }
cliclack = { workspace = true, optional = true }
console = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid.workspace = true
semver.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
zstd.workspace = true
wat = "1"
windows-registry.workspace = true
wit-component = { version = "=0.259.0", features = ["dummy-module"] }
wit-parser = "=0.259.0"
zup-xtask.workspace = true
