[package]
name = "zup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Developer-facing CLI for zup"
default-run = "zup"

[[bin]]
name = "zup"
path = "src/main.rs"

[[bin]]
name = "zup-setup"
path = "src/setup.rs"

[dependencies]
clap.workspace = true
miette.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
zup-windows.workspace = true
zup-build.workspace = true
zup-bundle.workspace = true
zup-core.workspace = true
zup-exec.workspace = true
zup-manifest.workspace = true
zup-plan.workspace = true
zup-platform.workspace = true
zup-runtime.workspace = true
zup-transaction.workspace = true
zup-update.workspace = true
zup-ui = { path = "../zup-ui" }
uuid.workspace = true
semver.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
windows-registry.workspace = true
