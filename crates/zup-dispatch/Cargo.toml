[package]
name = "zup-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tiny launcher that selects and starts a distribution variant"
# Never a tool a user installs: this package exists to produce zup-owned build
# artifacts, and `cargo install` putting one on a PATH would make an internal
# component a product with no review in between.
publish = false

[[bin]]
name = "zup-dispatch"
path = "src/main.rs"

[[bin]]
name = "zup-dispatch-console"
path = "src/console.rs"

[features]
default = []
# The online path. This is what turns a thin artifact from a description into a
# working installer, and it is the only thing the feature adds: a TUF client, an
# HTTP transport, and the acquisition engine. A dispatcher built without it
# still runs every offline artifact, and refuses a thin one with a clear reason
# rather than pretending.
online = ["dep:serde_json", "dep:tokio", "dep:zup-acquire", "dep:zup-update"]

[dependencies]
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
  "rt-multi-thread",
  "sync",
  "time",
  "fs",
  "macros",
  "io-util",
] }
windows-link.workspace = true
zup-acquire = { workspace = true, optional = true }
zup-artifact.workspace = true
zup-core.workspace = true
zup-update = { workspace = true, optional = true }
zup-windows.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
zstd.workspace = true
zup-acquire.workspace = true
zup-artifact.workspace = true
zup-xtask.workspace = true
