#:schema https://zup.dev/schema/zup.toml.json

schema = 1

[app]
id = "com.example.demo"
name = "Demo App"
version = "1.0.0"
publisher = "Example Software"
description = "A small application used to exercise Zup by hand."
main = "demo.cmd"

[build]

[build.targets.windows-x64]

source = { directory = "payload" }
frontend = "gui"

[install]
scope = "either"
allow_directory_override = true

[install.directory]
user = "${location.user_data}/Demo App"
machine = "${location.programs}/Demo App"

[ui]
[ui.settings]
description = "A tiny application you can install, change, repair and remove."

[[components]]
id = "program"
name = "Demo App"
description = "The program itself."
required = true
default = true

[[components]]
id = "docs"
name = "Documentation"
description = "Notes and reference material."
required = false
default = false

[[components]]
id = "samples"
name = "Sample data"
description = "Files to try the program out with."
required = false
default = true

[[files]]
id = "application"
source = "demo.cmd"

[[files]]
id = "notes"
source = "NOTES.txt"

[[files]]
id = "logo"
source = "branding/logo.svg"
placement = { kind = "generation", directory = "branding" }

[[files]]
id = "docs"
source = "docs/**"
placement = { kind = "generation", directory = "docs" }
component = "docs"

[[files]]
id = "samples"
source = "samples/**"
placement = { kind = "generation", directory = "samples" }
component = "samples"

[[launchers]]
id = "main"
location = "menu"
name = "Demo App"
target = "${payload}/demo.cmd"
arguments = ["--installed"]

[[launchers]]
id = "launcher-2"
location = "desktop"
name = "Demo App"
target = "${payload}/demo.cmd"
component = "program"

[[path]]
id = "cli-1"
value = "${payload}"
component = "program"
