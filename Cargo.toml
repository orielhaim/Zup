[workspace]
resolver = "3"
members = ["crates/*"]
# `fixtures/aurora` is deliberately not a member: it is a preset, and a preset
# outside this workspace is the only shape a third-party author has, so packing
# one from here has to go through a path dependency rather than a workspace edge.
exclude = ["fixtures/aurora"]
default-members = ["crates/zup"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/orielhaim/zup"
description = "A programmable application installer for the modern desktop"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

# Shared foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
zstd = "0.14"
thiserror = "2"
typed-path = "0.12"
tracing = "0.1"
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "serde",
] }
uuid = { version = "1", features = ["v7", "serde"] }
semver = { version = "1", features = ["serde"] }
target-lexicon = { version = "0.13", features = ["std"] }
bytes = "1"
object = { version = "0.40", default-features = false, features = [
  "read",
  "std",
] }

# Workspace crates
zup-automation = { path = "crates/zup-automation" }
zup-assets = { path = "crates/zup-assets" }
zup-core = { path = "crates/zup-core" }
zup-binary = { path = "crates/zup-binary" }
zup-pe = { path = "crates/zup-pe" }
zup-toolchain = { path = "crates/zup-toolchain" }
zup-signing = { path = "crates/zup-signing" }
zup-bootstrap = { path = "crates/zup-bootstrap" }
zup-manifest = { path = "crates/zup-manifest" }
zup-build = { path = "crates/zup-build" }
zup-acquire = { path = "crates/zup-acquire" }
zup-acquire-http = { path = "crates/zup-acquire-http" }
zup-artifact = { path = "crates/zup-artifact" }
zup-plan = { path = "crates/zup-plan" }
zup-platform = { path = "crates/zup-platform" }
zup-exec = { path = "crates/zup-exec" }
zup-transaction = { path = "crates/zup-transaction" }
zup-bundle = { path = "crates/zup-bundle" }
zup-publish = { path = "crates/zup-publish" }
zup-publish-github = { path = "crates/zup-publish-github" }
zup-distribute-github = { path = "crates/zup-distribute-github" }
zup-protocol = { path = "crates/zup-protocol" }
zup-runtime = { path = "crates/zup-runtime" }
zup-presentation = { path = "crates/zup-presentation" }
zup-ui-protocol = { path = "crates/zup-ui-protocol", version = "0.1.0" }
zup-ui-host = { path = "crates/zup-ui-host" }
zup-ui-compose = { path = "crates/zup-ui-compose" }
zup-preview = { path = "crates/zup-preview" }
zup-ui-dev = { path = "crates/zup-ui-dev" }
zup-ui-sdk = { path = "crates/zup-ui-sdk", version = "0.1.0" }
zup-ui-ipc = { path = "crates/zup-ui-ipc", version = "0.1.0" }
zup-windows = { path = "crates/zup-windows" }
zup-update = { path = "crates/zup-update" }
zup-plugin-contract = { path = "crates/zup-plugin-contract" }
zup-plugin-build = { path = "crates/zup-plugin-build" }
zup-plugin-runtime = { path = "crates/zup-plugin-runtime" }
zup-xtask = { path = "crates/zup-xtask" }

# Graph
petgraph = "0.8"

# Managed child processes. `process-wrap` owns the platform mechanics - a job
# object on Windows, a process group on Unix - so that terminating a child
# terminates the tree it started, on every supported desktop platform, from one
# code path. Which children get this treatment, and when they may be left
# running, stays zup's decision.
process-wrap = { version = "10", default-features = false, features = [
  "job-object",
  "process-group",
  "std",
] }

# Build / filesystem
atomic-write-file = "0.3"
walkdir = "2"
directories = "6"
globset = "0.4"
sha2 = "0.11"
wasmtime = { version = "49.0", default-features = false, features = [
  "component-model",
  "runtime",
  "std",
] }

opener = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cliclack = "0.5.6"
console = "0.16"
indicatif = "0.18"
inquire = "0.9"
miette = { version = "7", features = ["fancy"] }
toml_edit = "0.25"

# Manifest authoring
schemars = "1.2"
ts-rs = "12"
toml = "1.1"
url = "2"
serde_spanned = "1.1"

# Test
criterion = "0.8"
proptest = "1"
rstest = "0.27"
tempfile = "3"

# Verified remote artifacts
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
  "http2",
] }
secrecy = "0.10"
git-url-parse = "0.6"

# Retry with exponential backoff and jitter. `backon` supplies the curve; what
# counts as retryable and when to move to another origin stays zup's policy.
backon = { version = "1.6", default-features = false, features = [
  "std",
  "tokio",
  "tokio-sleep",
] }

# Focused Windows crates (prefer these over the `windows` umbrella crate)
windows-link = "0.100"
windows-registry = "0.100"
windows-result = "0.100"
lnks = { version = "0.2", default-features = false, features = ["runas"] }
windows-service = "0.8"
# Bindings for Windows APIs without an appropriate focused crate.
windows-bindgen = "0.100"
