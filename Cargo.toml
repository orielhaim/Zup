[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/zup-ui", "crates/zup-ui-gpui", "crates/zup-update"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orielhaim/zup"
description = "A programmable application installer for the modern desktop"

[workspace.dependencies]
# Shared foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
thiserror = "2"
tracing = "0.1"
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "serde",
] }
uuid = { version = "1", features = ["v7", "serde"] }
semver = { version = "1", features = ["serde"] }

# Workspace crates
zup-core = { path = "crates/zup-core" }
zup-manifest = { path = "crates/zup-manifest" }
zup-build = { path = "crates/zup-build" }
zup-plan = { path = "crates/zup-plan" }
zup-platform = { path = "crates/zup-platform" }
zup-exec = { path = "crates/zup-exec" }
zup-transaction = { path = "crates/zup-transaction" }
zup-bundle = { path = "crates/zup-bundle" }
zup-protocol = { path = "crates/zup-protocol" }
zup-runtime = { path = "crates/zup-runtime" }
zup-windows = { path = "crates/zup-windows" }

# Graph / transactions
petgraph = "0.8"
fs-transaction = "0.3"

# Build / filesystem
walkdir = "2"
globset = "0.4"
sha2 = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }
miette = "7"

# Manifest authoring
toml = "1.1"
serde_spanned = "1.1"
serde_ignored = "0.1"

# Test
rstest = "0.27"
tempfile = "3"

# Focused Windows crates (prefer these over the `windows` umbrella crate)
windows-link = "0.100"
windows-registry = "0.100"
windows-result = "0.100"
lnks = { version = "0.2", default-features = false, features = ["runas"] }
windows-service = "0.8"
# Bindings for Windows APIs without an appropriate focused crate.
windows-bindgen = "0.100"
