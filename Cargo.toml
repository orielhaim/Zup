[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/zup-ui-gpui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orielhaim/zup"
description = "A programmable application installer for the modern desktop"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

# Shared foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
zstd = "0.14"
thiserror = "2"
tracing = "0.1"
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "serde",
] }
uuid = { version = "1", features = ["v7", "serde"] }
semver = { version = "1", features = ["serde"] }
target-lexicon = { version = "0.13", features = ["std"] }

# Workspace crates
zup-core = { path = "crates/zup-core" }
zup-pe = { path = "crates/zup-pe" }
zup-dispatch = { path = "crates/zup-dispatch" }
zup-bootstrap = { path = "crates/zup-bootstrap" }
zup-manifest = { path = "crates/zup-manifest" }
zup-build = { path = "crates/zup-build" }
zup-acquire = { path = "crates/zup-acquire" }
zup-acquire-http = { path = "crates/zup-acquire-http" }
zup-artifact = { path = "crates/zup-artifact" }
zup-plan = { path = "crates/zup-plan" }
zup-platform = { path = "crates/zup-platform" }
zup-exec = { path = "crates/zup-exec" }
zup-transaction = { path = "crates/zup-transaction" }
zup-bundle = { path = "crates/zup-bundle" }
zup-protocol = { path = "crates/zup-protocol" }
zup-runtime = { path = "crates/zup-runtime" }
zup-presentation = { path = "crates/zup-presentation" }
zup-windows = { path = "crates/zup-windows" }
zup-update = { path = "crates/zup-update" }
zup-plugin-contract = { path = "crates/zup-plugin-contract" }
zup-plugin-build = { path = "crates/zup-plugin-build" }
zup-plugin-runtime = { path = "crates/zup-plugin-runtime" }
zup-xtask = { path = "crates/zup-xtask" }

# Graph / transactions
petgraph = "0.8"
fs-transaction = "0.3"

# Build / filesystem
walkdir = "2"
globset = "0.4"
sha2 = "0.11"
wasmtime = { version = "49.0", default-features = false, features = [
  "component-model",
  "runtime",
  "std",
] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cliclack = "0.5.6"
console = "0.16"
indicatif = "0.18"
inquire = "0.9"
miette = { version = "7", features = ["fancy"] }
toml_edit = "0.25"

# Manifest authoring
schemars = "1.2"
toml = "1.1"
url = "2"
serde_spanned = "1.1"
serde_ignored = "0.1"

# Test
criterion = "0.8"
rstest = "0.27"
tempfile = "3"

# Verified remote artifacts
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
  "http2",
] }
# Retry with exponential backoff and jitter. `backon` supplies the curve; what
# counts as retryable and when to move to another origin stays zup's policy.
backon = { version = "1.6", default-features = false, features = [
  "std",
  "tokio",
  "tokio-sleep",
] }

# Focused Windows crates (prefer these over the `windows` umbrella crate)
windows-link = "0.100"
windows-registry = "0.100"
windows-result = "0.100"
lnks = { version = "0.2", default-features = false, features = ["runas"] }
windows-service = "0.8"
# Bindings for Windows APIs without an appropriate focused crate.
windows-bindgen = "0.100"
