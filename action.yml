name: zup
description: >-
  Build, compose, sign, attest and publish a zup release. Installs the zup CLI,
  runs the phase you asked for, and reports the result as annotations, a job
  summary and typed outputs.
author: zup

runs:
  using: node24
  main: action/dist/index.js

branding:
  icon: package
  color: purple

inputs:
  operation:
    description: >-
      What this step does. `setup` installs zup and stops. `check` runs
      `zup check`, which resolves and validates the project and builds nothing.
      `build` runs
      `zup build`. `compose` folds per-target output into one release with
      `zup publish stage`. `finalize` runs `zup sign verify`, which checks every
      signature and rewrites the release description with the identity that will
      be published. `attest` attests the artifacts a release manifest names, and
      implies `attest: true`. `publish` publishes an already-composed and
      finalized release with `zup publish github`. `release` runs build, compose,
      finalize, attest and publish in that order, and attests only when
      `attest: true`.
    required: false
    default: build

  project-path:
    description: >-
      Directory holding `zup.toml`. Relative paths resolve against the
      workspace.
    required: false
    default: "."

  zup-version:
    description: >-
      The zup CLI version to install. Defaults to the version this action build
      was tested against, which is what makes a pinned action ref produce a
      reproducible build. `latest` resolves at run time and is not reproducible.
    required: false

  zup-path:
    description: >-
      Path to a zup executable to use instead of installing one. For local
      development, a self-hosted runner with a locally built zup, and testing
      this action against a zup built from the same commit.
    required: false

  release-dir:
    description: >-
      The release directory, relative to `project-path`. Every phase reads and
      writes here, so it has to name the same directory in each of them.
    required: false
    default: dist

  target:
    description: >-
      Target profiles to build, as a multi-line or comma-separated list. Names a
      profile from `zup.toml`, not a target triple. Omit to build what the
      manifest declares.
    required: false

  artifact:
    description: >-
      Declared distribution artifacts to compose, as a multi-line or
      comma-separated list. Conflicts with `target`.
    required: false

  github-token:
    description: >-
      The credential used by `publish` and `release`. Masked immediately, and
      present only in the environment of the `zup publish github` process - never
      in a build, which may run Tauri, Electron, Cargo build scripts and npm
      scripts. Builds need no credential at all.
    required: false
    default: ${{ github.token }}

  repo:
    description: >-
      Publish to `owner/name` rather than the repository the workflow is running
      in. `host/owner/name` for GitHub Enterprise.
    required: false

  tag:
    description: The release tag. Defaults to the manifest's version and tag prefix.
    required: false

  draft:
    description: Leave the release a draft.
    required: false
    default: "false"

  prerelease:
    description: Mark the release a prerelease.
    required: false
    default: "false"

  dry-run:
    description: >-
      Plan and verify without writing anything. Still needs a credential for the
      publication checks, and does not need write permissions.
    required: false
    default: "false"

  upload-workflow-artifacts:
    description: >-
      Upload the release directory to workflow artifact storage, so another job
      can collect it. Off by default: a release can be gigabytes, and nobody
      expects a build step to spend artifact storage without being asked.
    required: false
    default: "false"

  workflow-artifact-name:
    description: >-
      The artifact's name. Defaults to the zup version and the runner's platform
      and architecture. An unarchived upload is named after the file it contains
      rather than this value, and the log says so when that happens.
    required: false

  artifact-retention-days:
    description: How long to keep the workflow artifact. The service caps this at 90 days.
    required: false

  attest:
    description: >-
      Create Sigstore-backed build-provenance attestations for the artifacts the
      release manifest names. Adds the attestation phase to `operation: release`;
      `operation: attest` already implies it. Requires `contents: read`,
      `id-token: write` and `attestations: write`, and a plan that supports
      attestations. A requested attestation that cannot be created is an error
      rather than a skip.
    required: false
    default: "false"

  attest-paths:
    description: >-
      Extra subjects to attest, relative to `release-dir`, as a multi-line list.
      A path that does not exist is an error: an attestation of a file nobody
      receives is a claim nothing can check.
    required: false

  allow-unsafe-publish:
    description: >-
      Permit `publish` and `release` on `pull_request_target` and `workflow_run`,
      where the job holds the base repository's secrets and write token while
      running code that may have come from a fork. Off by default, and refusing
      is the point - see the action's documentation for the safe pattern.
    required: false
    default: "false"

  receipt:
    description: >-
      Where the publisher writes its receipt, relative to `project-path`.
      Defaults to `<release-dir>/github-publish.json`. Also the value of the
      `publish-receipt` output.
    required: false

  args:
    description: >-
      Extra arguments appended to the zup command, in zup's own quoting rules.
      Never passed through a shell, so spaces, quotes and backticks are just
      characters. Appended last, so a typed input above can be overridden here.
    required: false

outputs:
  zup-path:
    description: Absolute path to the zup executable this step used.
  zup-version:
    description: The zup version that was installed or used.
  app-version:
    description: The application's version, from zup's result.
  artifact-paths:
    description: >-
      JSON array of the artifacts a build produced, each with `path`, `size` and
      `digest`. Paths are relative to `release-dir`.
  release-manifest:
    description: The release description, relative to `project-path`.
  release-id:
    description: >-
      The provider's own reference for the release, as a string. GitHub's are
      19-digit snowflakes, which no consumer using a JavaScript number could hold
      exactly.
  release-url:
    description: The release page.
  publish-receipt:
    description: The publisher's receipt, relative to `project-path`.
