[profile.default]
test-threads = 8
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups.systemd-manager]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(zup-linux) & binary(services_systemd)'
test-group = 'systemd-manager'

# Fast CI excludes staged-toolchain tests and generated SDK projects.
[profile.fast]
test-threads = 8
default-filter = '''
not (
  binary(artifact_build) or binary(build_installer) or binary(thin_publish)
  or binary(preview) or binary(linux_build) or binary(generated_projects)
  or package(zup-preview)
  or (package(zup-installer) and (
    binary(lifecycle) or binary(frontends) or binary(generated_files)
    or binary(preset_session) or binary(preset_persistence)
  ))
  or (package(zup-linux) and (binary(process) or binary(gui)))
  or (package(zup-windows) and binary(universal))
)
'''

[profile.default.junit]
path = "junit.xml"

[profile.fast.junit]
path = "junit.xml"

[profile.systemd.junit]
path = "junit.xml"

# Run the staged-toolchain cases once on each x64 native host.
[profile.integration]
test-threads = 8
default-filter = '''
  binary(artifact_build) or binary(build_installer) or binary(thin_publish)
  or binary(preview) or binary(linux_build)
  or package(zup-preview)
  or (package(zup-installer) and (
    binary(lifecycle) or binary(frontends) or binary(generated_files)
    or binary(preset_session) or binary(preset_persistence)
  ))
  or (package(zup-linux) and (binary(process) or binary(gui)))
  or (package(zup-windows) and binary(universal))
'''

[profile.integration.junit]
path = "junit.xml"
