name: action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# `contents: read` is the ceiling for this workflow. It typechecks, lints, tests
# and builds an action; it never publishes, never creates a release, and never
# needs a token it was not granted.
permissions:
  contents: read

concurrency:
  group: action-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every step installs from the lockfile. A drifting `bun.lock` is how a
  # transitive dependency changes underneath a release pipeline.
  BUN_CONFIG_FROZEN_LOCKFILE: "true"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Two runtimes, on purpose.
      #
      # Bun builds and tests the action. Node 24 *runs* it, because that is the
      # runtime GitHub uses. The step below that pins Node's major version is the
      # one that matters: a bundle Bun is happy with and Node cannot load is a
      # green CI run and a broken release in somebody else's workflow.
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format
        run: bun run biome

      - name: Unit tests
        run: bun test

      - name: Bundle
        run: bun run build

      # The reason this workflow exists. `action/dist` is checked in, because
      # GitHub runs an action from the repository without installing anything, so
      # a stale bundle is a released action running code that no longer matches
      # its source. This step is the only thing standing between that and main.
      - name: Dist is current
        run: |
          git diff --exit-code -- action/dist
          echo "the checked-in bundle matches action/src"

      - name: Metadata
        run: bun run metadata

      # The bundle, under Node. Not under Bun — that is the whole point. It
      # proves the artifact is a single ESM file, contains no `Bun.*` API, bakes
      # in no build-machine path, and actually runs to completion.
      - name: The bundle runs on Node 24
        run: |
          echo "node $(node --version)"
          node scripts/verify-runtime.mjs

  real-zup:
    name: real zup (${{ matrix.runner }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: action-e2e-${{ matrix.runner }}

      # A real zup, from this commit, next to the action. `zup-path` is the input the
      # action's own tests use, and it is why testing the action does not require
      # having released it.
      - name: Build zup
        run: cargo build --release --bin zup

      - name: A project for it
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'acme'
          New-Item -ItemType Directory -Force -Path (Join-Path $project 'dist') | Out-Null
          Set-Content -Path (Join-Path $project 'dist/app.bin') -Value 'payload' -NoNewline
          @'
          schema = 1

          [app]
          id = "com.acme.e2e"
          name = "Acme"
          version = "1.4.0"
          main = "app.bin"

          [build]

          [build.targets.default]
          target = "x86_64-pc-windows-msvc"
          source = { directory = "dist" }

          [install]
          scope = "user"

          [install.directory]
          user = "${location.user_data}/Acme"

          [[files]]
          source = "**/*"
          destination = "${install}"
          '@ | Set-Content -Path (Join-Path $project 'zup.toml') -NoNewline
          "PROJECT=$project" >> $env:GITHUB_ENV
          "ZUP=$env:GITHUB_WORKSPACE\target\release\zup.exe" >> $env:GITHUB_ENV

      - name: Setup
        id: setup
        uses: ./
        with:
          operation: setup
          zup-path: ${{ env.ZUP }}

      - name: The real zup is on PATH
        run: zup --version

      - name: Check
        id: check
        uses: ./
        with:
          operation: check
          project-path: ${{ env.PROJECT }}
          zup-path: ${{ env.ZUP }}

      # The outputs come from the protocol document zup actually wrote, not from a
      # transcript of one. `app-version: 1.4.0` is in the fixture project, and the
      # action read it out of `application.version`.
      - name: Outputs
        env:
          APP_VERSION: ${{ steps.check.outputs.app-version }}
          ZUP_PATH: ${{ steps.check.outputs.zup-path }}
        run: |
          if ($env:APP_VERSION -ne '1.4.0') {
            throw "app-version was '$($env:APP_VERSION)', expected 1.4.0"
          }
          if (-not (Test-Path $env:ZUP_PATH)) { throw "zup-path does not exist" }
          'outputs came from the protocol document'

      - name: A summary was written from the result
        run: |
          $summary = Get-Content -Raw $env:GITHUB_STEP_SUMMARY
          if ($summary -notmatch '1\.4\.0') {
            throw "the summary does not carry the version: $summary"
          }
          if ($summary -match '"protocol"') {
            throw 'the summary dumped the machine document'
          }
          'the summary is a record, not a transcript'

      # A path with a space in it, which is where a shell-based implementation breaks
      # and an argv-based one does not.
      - name: A project path with a space
        uses: ./
        with:
          operation: check
          project-path: ${{ env.RUNNER_TEMP }}\my project
          zup-path: ${{ env.ZUP }}

      # A failing zup has to fail the step, and the failure has to come from the
      # protocol document rather than from scraping stderr. The manifest is invalid,
      # so `zup check` exits nonzero *and* writes a result.
      - name: A failing zup fails the step
        id: failure
        continue-on-error: true
        uses: ./
        with:
          operation: check
          project-path: ${{ env.RUNNER_TEMP }}\broken
          zup-path: ${{ env.ZUP }}

      - name: The failure came from the result, with its code
        run: |
          if ('${{ steps.failure.outcome }}' -ne 'failure') {
            throw 'a failing zup did not fail the step'
          }
          $summary = Get-Content -Raw $env:GITHUB_STEP_SUMMARY
          if ($summary -notmatch 'zup\.') {
            throw "the summary did not name a diagnostic code: $summary"
          }
          'the failure is the protocol document, not a scraped log'

  tool-bootstrap:
    # Opt-in, and separate, because it needs a published zup release to exist and
    # reaches the network. The e2e job above covers the action itself; this covers
    # the one path a `zup-path` stub cannot.
    name: tool bootstrap
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve the newest published zup
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Install from the release
        id: setup
        uses: ./
        with:
          operation: setup
          zup-version: ${{ steps.release.outputs.version }}

      - name: It runs
        shell: bash
        run: zup --version
