name: action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_CONFIG_FROZEN_LOCKFILE: "true"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format
        run: bun run biome

      - name: Unit tests
        run: bun test

      - name: Bundle
        run: bun run build

      - name: Dist is current
        run: |
          git diff --exit-code -- action/dist
          echo "the checked-in bundle matches action/src"

      - name: Metadata
        run: bun run metadata

      - name: The bundle runs on Node 24
        run: |
          echo "node $(node --version)"
          node scripts/verify-runtime.mjs

  real-zup:
    name: real zup (${{ matrix.runner }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: action-e2e-${{ matrix.runner }}

      - name: Build zup
        run: cargo build --release --bin zup

      - name: A project for it
        # Three projects, because three steps below point at three directories.
        # Headless, and deliberately so: this job is about the action - its
        # outputs, its summary, and how it reports a failure - and it builds only
        # the `zup` binary, so nothing here has staged a preset. The default
        # frontend is graphical, and a graphical project refuses to be checked
        # without one, so `zup check` failed with `preset_unavailable` and every
        # assertion below was about a step that had already stopped.
        run: |
          function New-ZupProject([string] $Root, [string] $Version) {
            New-Item -ItemType Directory -Force -Path (Join-Path $Root 'dist') | Out-Null
            Set-Content -Path (Join-Path $Root 'dist/app.bin') -Value 'payload' -NoNewline
            @"
          schema = 1
          frontend = "headless"

          [app]
          id = "com.acme.e2e"
          name = "Acme"
          version = "$Version"
          main = "app.bin"

          [build]

          [build.targets.default]
          target = "x86_64-pc-windows-msvc"
          source = { directory = "dist" }

          [install]
          scope = "user"

          [install.directory]
          user = "`${location.user_data}/Acme"

          [[files]]
          source = "**/*"
          destination = "`${install}"
          "@ | Set-Content -Path (Join-Path $Root 'zup.toml') -NoNewline
          }

          $project = Join-Path $env:RUNNER_TEMP 'acme'
          New-ZupProject $project '1.4.0'

          # A second copy at a path with a space, because an argument that is
          # passed as one value is the whole claim that step makes.
          $spaced = Join-Path $env:RUNNER_TEMP 'my project'
          New-ZupProject $spaced '1.4.0'

          # A manifest that is present and wrong, rather than a directory that is
          # absent. Both make the step fail, but only this one proves the failure
          # came from reading the project and naming a line in it.
          $broken = Join-Path $env:RUNNER_TEMP 'broken'
          New-ZupProject $broken 'not-a-version'

          # Every path a later step names is written here, rather than each
          # spelling out `${{ env.RUNNER_TEMP }}` again. That expression does not
          # carry the runner's own variables - they live in the `runner` context -
          # so it expanded to nothing and the step was handed `\my project`.
          "PROJECT=$project" >> $env:GITHUB_ENV
          "SPACED=$spaced" >> $env:GITHUB_ENV
          "BROKEN=$broken" >> $env:GITHUB_ENV
          "ZUP=$env:GITHUB_WORKSPACE\target\release\zup.exe" >> $env:GITHUB_ENV

      - name: Setup
        id: setup
        uses: ./
        with:
          operation: setup
          zup-path: ${{ env.ZUP }}

      - name: The real zup is on PATH
        run: zup --version

      - name: Check
        id: check
        uses: ./
        with:
          operation: check
          project-path: ${{ env.PROJECT }}
          zup-path: ${{ env.ZUP }}

      - name: Outputs
        env:
          APP_VERSION: ${{ steps.check.outputs.app-version }}
          ZUP_PATH: ${{ steps.check.outputs.zup-path }}
        run: |
          if ($env:APP_VERSION -ne '1.4.0') {
            throw "app-version was '$($env:APP_VERSION)', expected 1.4.0"
          }
          if (-not (Test-Path $env:ZUP_PATH)) { throw "zup-path does not exist" }
          'outputs came from the protocol document'

      - name: A summary was written from the result
        run: |
          $summary = Get-Content -Raw $env:GITHUB_STEP_SUMMARY
          if ($summary -notmatch '1\.4\.0') {
            throw "the summary does not carry the version: $summary"
          }
          if ($summary -match '"protocol"') {
            throw 'the summary dumped the machine document'
          }
          'the summary is a record, not a transcript'

      - name: A project path with a space
        uses: ./
        with:
          operation: check
          project-path: ${{ env.SPACED }}
          zup-path: ${{ env.ZUP }}

      - name: A failing zup fails the step
        id: failure
        continue-on-error: true
        uses: ./
        with:
          operation: check
          project-path: ${{ env.BROKEN }}
          zup-path: ${{ env.ZUP }}

      - name: The failure came from the result, with its code
        run: |
          if ('${{ steps.failure.outcome }}' -ne 'failure') {
            throw 'a failing zup did not fail the step'
          }
          $summary = Get-Content -Raw $env:GITHUB_STEP_SUMMARY
          if ($summary -notmatch 'zup\.') {
            throw "the summary did not name a diagnostic code: $summary"
          }
          'the failure is the protocol document, not a scraped log'

  tool-bootstrap:
    name: tool bootstrap
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve the newest published zup
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Install from the release
        id: setup
        uses: ./
        with:
          operation: setup
          zup-version: ${{ steps.release.outputs.version }}

      - name: It runs
        shell: bash
        run: zup --version
