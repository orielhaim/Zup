name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-full

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-machete

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # A build composes a real installer, so the composition and runtime tests
      # need real components. `cargo xtask toolchain build` produces all seven —
      # three runtime templates and four launchers — and stages them beside `zup`
      # with the descriptors the toolchain resolver checks. Debug is the profile
      # `cargo test` runs in, and the resolver searches beside the test binary.
      - name: Toolchain
        run: cargo xtask toolchain build

      - name: Tests
        run: cargo nextest run --workspace --all-features

      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      - name: Unused dependencies
        run: cargo machete

      - name: Whitespace
        run: git diff --check

      - name: Portable boundary
        run: cargo xtask verify-portable-boundaries

      - name: Action refs
        run: cargo xtask github-action-pins check

      - name: Published schema
        run: |
          cargo run -p zup --bin zup -- schema --output schema/zup.schema.json
          git diff --exit-code -- schema/zup.schema.json

      # The whole reason the developer CLI and the installer runtime are two
      # packages: a role must be a package, not a Cargo feature. This checks that
      # each runtime frontend builds alone, that no frontend can reach the build
      # plane, and that the developer CLI is the only installable binary.
      - name: Role boundaries
        shell: pwsh
        run: ./scripts/verify-frontend-features.ps1

  ubuntu-portable:
    name: ubuntu (portable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-portable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146,cargo-machete

      - name: Package matrices
        run: |
          cargo xtask emit-portable-matrix
          core="$(cargo xtask emit-portable-matrix --matrix portable-core --format cargo-args)"
          tests="$(cargo xtask emit-portable-matrix --matrix portable-tests --format cargo-args)"
          printf 'PORTABLE=%s %s\n' "$core" "$tests" >> "$GITHUB_ENV"

      - name: Portable boundary
        run: cargo xtask verify-portable-boundaries

      - name: Check
        run: cargo check --all-features $PORTABLE

      - name: Tests
        run: cargo nextest run --all-features $PORTABLE

      - name: Doc tests
        run: cargo test --doc --all-features $PORTABLE

      - name: Clippy
        run: cargo clippy --all-features --all-targets $PORTABLE -- -D warnings

      - name: Unused dependencies
        run: cargo machete

      - name: Whitespace
        run: git diff --check
