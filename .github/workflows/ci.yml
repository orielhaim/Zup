name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-${{ runner.os }}-${{ runner.arch }}-debug0
          cache-on-failure: false

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
        with:
          platform: win64

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
        with:
          mold-version: 3.0.0
          make-default: "true"

      - name: Formatting
        run: cargo fmt --all --check

      - name: Linux package selection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          portable="$(cargo xtask emit-host-packages --host any --format cargo-args)"
          linux="$(cargo xtask emit-host-packages --host linux --format cargo-args)"
          printf 'PORTABLE=%s\nLINUX=%s\n' "$portable" "$linux" >> "$GITHUB_ENV"

      - name: Windows Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Linux Clippy
        if: runner.os == 'Linux'
        shell: bash
        run: cargo clippy --all-features --all-targets $PORTABLE $LINUX -- -D warnings

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-${{ runner.os }}-${{ runner.arch }}-debug0
          cache-on-failure: false

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
        with:
          platform: win64

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
        with:
          mold-version: 3.0.0
          make-default: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Linux package selection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          portable="$(cargo xtask emit-host-packages --host any --format cargo-args)"
          linux="$(cargo xtask emit-host-packages --host linux --format cargo-args)"
          printf 'PORTABLE=%s\nLINUX=%s\n' "$portable" "$linux" >> "$GITHUB_ENV"

      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shared-mime-info pkg-config libfontconfig1-dev libfreetype-dev libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
          command -v update-mime-database
          command -v update-desktop-database
          command -v desktop-file-validate
          mold --version

      - name: Windows tests
        if: runner.os == 'Windows'
        run: cargo nextest run --workspace --all-features --no-fail-fast --profile fast

      - name: Windows machine authority tests
        if: runner.os == 'Windows'
        run: cargo nextest run -p zup-windows --all-features --run-ignored ignored-only --no-fail-fast -E 'test(machine_fs::tests) | test(machine_authority::tests) | test(machine_runtime_)'

      - name: Linux tests
        if: runner.os == 'Linux'
        shell: bash
        run: cargo nextest run --all-features --no-fail-fast --profile fast $PORTABLE $LINUX

      - name: Windows doc tests
        if: runner.os == 'Windows'
        run: cargo test --workspace --all-features --doc

      - name: Linux doc tests
        if: runner.os == 'Linux'
        shell: bash
        run: cargo test --doc --all-features $PORTABLE $LINUX

  terminal-arm64:
    name: terminal ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: terminal-${{ runner.os }}-${{ runner.arch }}-debug0
          cache-on-failure: false

      - name: Terminal and automation lifecycle
        run: cargo test -p zup-installer --no-default-features --features console,headless,online --test terminal
