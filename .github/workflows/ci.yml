name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-full

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146,cargo-machete,cargo-deny@0.20.0

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Toolchain
        run: cargo xtask toolchain build

      - name: Tests
        run: cargo nextest run --workspace --all-features

      # The generated projects are the first thing a new author compiles, and a
      # template that does not build is found by them rather than by us. Ignored by
      # the run above because they compile the whole GPUI stack and the bindings
      # generator, which is minutes rather than seconds.
      - name: Generated projects
        run: cargo nextest run -p zup --all-features --run-ignored all -E 'test(compiles)'

      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      - name: Unused dependencies
        run: cargo machete

      - name: Supply chain policy
        run: cargo deny check

      - name: Dependency graph
        run: cargo xtask verify-dependency-graph

      - name: Whitespace
        run: git diff --check

      - name: Portable boundary
        run: cargo xtask verify-portable-boundaries

      - name: Published authoring surface
        shell: pwsh
        run: ./scripts/verify-public-crates.ps1

      - name: Action refs
        run: cargo xtask github-action-pins check

      - name: Published schema
        run: |
          cargo run -p zup --bin zup -- schema --output schema/zup.schema.json
          git diff --exit-code -- schema/zup.schema.json

      - name: Automation contract
        run: cargo xtask automation check

      - name: Role boundaries
        shell: pwsh
        run: ./scripts/verify-frontend-features.ps1

  clean-room:
    name: clean room
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: clean-room

      - name: Toolchain
        run: cargo xtask toolchain build

      - name: Package
        run: cargo xtask toolchain package

      - name: Clean room
        run: cargo xtask release clean-room

  release-size:
    name: release size
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-size

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Toolchain (release)
        run: cargo xtask toolchain build --profile release

      - name: Bootstrapper budget
        run: cargo nextest run -p zup-dispatch --all-features --run-ignored all -E 'test(a_thin_bootstrapper)'

  ubuntu-portable:
    name: ubuntu (portable + linux backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-portable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146,cargo-machete

      # Both lists come from the package matrices rather than from this workflow.
      # A hand-maintained list would be a second place a package could be dropped
      # from coverage, and the boundary's whole job is that there is only one.
      - name: Package matrices
        run: |
          cargo xtask emit-portable-matrix
          cargo xtask emit-host-packages --host any
          cargo xtask emit-host-packages --host linux
          portable="$(cargo xtask emit-host-packages --host any --format cargo-args)"
          linux="$(cargo xtask emit-host-packages --host linux --format cargo-args)"
          printf 'PORTABLE=%s\nLINUX=%s\n' "$portable $linux" "$linux" >> "$GITHUB_ENV"

      # The two structural gates run on Linux as well as Windows, because both are
      # read from Cargo metadata rather than from anything host-specific: a
      # backend-isolation or portable-dependency violation is the same violation
      # whichever machine runs the check.
      - name: Portable boundary
        run: cargo xtask verify-portable-boundaries

      - name: Dependency graph
        run: cargo xtask verify-dependency-graph

      - name: Check
        run: cargo check --all-features $PORTABLE

      # The Linux backend's own suite runs natively rather than being cross-checked,
      # because what it tests is filesystem semantics - symlinks, permission bits,
      # XDG resolution - that a build check cannot establish.
      - name: Linux backend tests
        run: cargo nextest run --all-features $LINUX

      - name: Tests
        run: cargo nextest run --all-features $PORTABLE

      - name: Doc tests
        run: cargo test --doc --all-features $PORTABLE

      - name: Clippy
        run: cargo clippy --all-features --all-targets $PORTABLE -- -D warnings

      - name: Unused dependencies
        run: cargo machete

      - name: Whitespace
        run: git diff --check
