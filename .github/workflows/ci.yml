name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fast:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
            platform: windows
          - name: Linux
            runner: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Formatting
        run: cargo fmt --all --check
      - name: Linux package selection
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          portable="$(cargo xtask emit-host-packages --host any --format cargo-args)"
          linux="$(cargo xtask emit-host-packages --host linux --format cargo-args)"
          printf 'PORTABLE=%s\nLINUX=%s\n' "$portable" "$linux" >> "$GITHUB_ENV"

      - name: Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shared-mime-info

      - name: Windows Clippy
        if: matrix.platform == 'windows'
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Linux Clippy
        if: matrix.platform == 'linux'
        shell: bash
        run: cargo clippy --all-features --all-targets $PORTABLE $LINUX -- -D warnings

      - name: Toolchain
        run: cargo xtask toolchain build

      - name: Windows tests
        if: matrix.platform == 'windows'
        run: cargo nextest run --workspace --all-features

      - name: Linux tests
        if: matrix.platform == 'linux'
        shell: bash
        run: cargo nextest run --all-features $PORTABLE $LINUX

      - name: Windows doc tests
        if: matrix.platform == 'windows'
        run: cargo test --workspace --all-features --doc

      - name: Linux doc tests
        if: matrix.platform == 'linux'
        shell: bash
        run: cargo test --doc --all-features $PORTABLE $LINUX

  full:
    name: full verification (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Toolchain
        run: cargo xtask toolchain build

      - name: Tests
        run: cargo nextest run --workspace --all-features

      - name: Release clean-room
        shell: pwsh
        run: |
          cargo xtask toolchain package
          cargo xtask release clean-room

      - name: Published schema
        shell: pwsh
        run: |
          cargo run -p zup --bin zup -- schema --output schema/zup.schema.json
          git diff --exit-code -- schema/zup.schema.json
