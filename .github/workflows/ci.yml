name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-Windows
      - name: Windows Clippy
        shell: pwsh
        run: |
          & cargo clippy --workspace --all-features --all-targets -- -D warnings *> "$env:RUNNER_TEMP/diagnostic.log"
          $status = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/diagnostic.log"
          exit $status
      - name: Emit failure output
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "diagnostic.log"
          if log.is_file():
              text = log.read_bytes()[-12000:].decode("utf-8", errors="replace")
              for offset in range(0, len(text), 3000):
                  chunk = text[offset:offset + 3000]
                  chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Clippy diagnostic part {offset // 3000 + 1}::{chunk}")
