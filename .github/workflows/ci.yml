name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
            platform: windows
          - name: Linux
            runner: ubuntu-24.04
            platform: linux

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
          targets: ${{ matrix.platform == 'windows' && 'i686-pc-windows-msvc,wasm32-unknown-unknown,x86_64-unknown-linux-gnu' || '' }}

      - uses: rui314/setup-mold@v1
        if: matrix.platform == 'linux'
        with:
          mold-version: 3.0.0
          make-default: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ matrix.platform == 'windows' && 'cargo-nextest@0.9.146,cargo-machete,cargo-deny@0.20.0,cargo-zigbuild@0.23.4' || 'cargo-nextest@0.9.146' }}

      - name: Formatting
        if: matrix.platform == 'windows'
        run: cargo fmt --all --check

      - name: Dependency graph
        if: matrix.platform == 'windows'
        run: cargo xtask verify-dependency-graph

      - name: Portable boundaries
        if: matrix.platform == 'windows'
        run: cargo xtask verify-portable-boundaries

      - name: Action references
        if: matrix.platform == 'windows'
        run: cargo xtask github-action-pins check

      - name: Automation contract
        if: matrix.platform == 'windows'
        run: cargo xtask automation check

      - name: Published authoring surface
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/verify-public-crates.ps1

      - name: Role boundaries
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/verify-frontend-features.ps1

      - name: Whitespace
        if: matrix.platform == 'windows'
        run: git diff --check HEAD^1 HEAD

      - name: Supply chain policy
        if: matrix.platform == 'windows'
        run: cargo deny check

      - name: Unused dependencies
        if: matrix.platform == 'windows'
        run: cargo machete

      - name: Windows Clippy
        if: matrix.platform == 'windows'
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Windows toolchain
        if: matrix.platform == 'windows'
        run: cargo xtask toolchain build

      - name: Windows tests
        if: matrix.platform == 'windows'
        run: cargo nextest run --workspace --all-features

      - name: Generated projects
        if: matrix.platform == 'windows'
        run: cargo nextest run -p zup --all-features --run-ignored all -E 'test(compiles)'

      - name: Windows doc tests
        if: matrix.platform == 'windows'
        run: cargo test --workspace --all-features --doc

      - name: Published schema
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo run -p zup --bin zup -- schema --output schema/zup.schema.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- schema/zup.schema.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean-room release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo xtask toolchain package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask release clean-room
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: mlugg/setup-zig@v2
        if: matrix.platform == 'windows'
        with:
          version: 0.17.0

      - name: Cross-build Linux toolchain
        if: matrix.platform == 'windows'
        run: cargo xtask toolchain build --target x86_64-unknown-linux-gnu

      - name: Build Windows CLI
        if: matrix.platform == 'windows'
        run: cargo build -p zup

      - name: Windows-host Linux E2E
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          function Invoke-Zup {
            & .\target\debug\zup.exe @args
          }

          $fixture = Join-Path $env:RUNNER_TEMP 'zup-linux-fixture'
          Remove-Item -Recurse -Force $fixture -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $fixture, (Join-Path $fixture 'dist') | Out-Null

          @'
          schema = 1

          [app]
          id = "com.example.tool"
          name = "Tool"
          version = "1.0.0"

          [build]

          [build.targets.linux]
          target = "x86_64-unknown-linux-gnu"
          frontend = "console"
          source = { directory = "dist" }

          [install]
          scope = "user"

          [install.directory]
          user = "${location.programs}/tool"

          [[files]]
          source = "tool"
          destination = "${install}"
          executable = true

          [[files]]
          source = "keep.dat"
          destination = "${install}"
          '@ | Set-Content (Join-Path $fixture 'zup.toml') -NoNewline -Encoding utf8

          [IO.File]::WriteAllBytes(
            (Join-Path $fixture 'dist/tool'),
            [Text.Encoding]::UTF8.GetBytes("#!/bin/sh`n")
          )
          [IO.File]::WriteAllBytes(
            (Join-Path $fixture 'dist/keep.dat'),
            [Text.Encoding]::UTF8.GetBytes('keep-v1')
          )

          $manifest = Join-Path $fixture 'zup.toml'
          Invoke-Zup check --manifest $manifest --target linux
          Invoke-Zup doctor --manifest $manifest --target linux
          Invoke-Zup build --manifest $manifest --target linux
          Invoke-Zup artifact inspect (Join-Path $fixture 'Tool-Setup')

          $env:ZUP_FIXTURE = $fixture
          @'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ZUP_FIXTURE"])
          assert (root / "Tool-Setup").read_bytes()[:4] == b"\x7fELF"

          release = json.loads((root / "zup-release.json").read_text())
          assert release["variants"][0]["target"] == "x86_64-unknown-linux-gnu"
          assert release["artifacts"][0]["path"] == "Tool-Setup"
          text = json.dumps(release)
          assert ".exe" not in text
          assert "Authenticode" not in text
          '@ | python -

          $machine = Join-Path $env:RUNNER_TEMP 'zup-linux-machine-fixture'
          Remove-Item -Recurse -Force $machine -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $machine, (Join-Path $machine 'dist') | Out-Null

          @'
          schema = 1

          [app]
          id = "com.example.tool"
          name = "Tool"
          version = "1.0.0"

          [build]

          [build.targets.linux]
          target = "x86_64-unknown-linux-gnu"
          frontend = "console"
          source = { directory = "dist" }

          [install]
          scope = "machine"

          [install.directory]
          machine = "${location.programs}/tool"

          [[files]]
          source = "tool"
          destination = "${install}"
          executable = true
          '@ | Set-Content (Join-Path $machine 'zup.toml') -NoNewline -Encoding utf8

          [IO.File]::WriteAllBytes(
            (Join-Path $machine 'dist/tool'),
            [Text.Encoding]::UTF8.GetBytes("#!/bin/sh`n")
          )

          $machineManifest = Join-Path $machine 'zup.toml'
          Invoke-Zup check --manifest $machineManifest --target linux
          Invoke-Zup doctor --manifest $machineManifest --target linux
          Invoke-Zup build --manifest $machineManifest --target linux

          $env:ZUP_FIXTURE = $machine
          @'
          import os
          from pathlib import Path

          root = Path(os.environ["ZUP_FIXTURE"])
          assert (root / "Tool-Setup").read_bytes()[:4] == b"\x7fELF"
          '@ | python -

      - name: Release bootstrapper budget
        if: matrix.platform == 'windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          cargo xtask toolchain build --profile release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run -p zup-dispatch --all-features --run-ignored all -E 'test(a_thin_bootstrapper)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Linux package selection
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask emit-portable-matrix
          cargo xtask emit-host-packages --host any
          cargo xtask emit-host-packages --host linux
          portable="$(cargo xtask emit-host-packages --host any --format cargo-args)"
          linux="$(cargo xtask emit-host-packages --host linux --format cargo-args)"
          printf 'PORTABLE=%s\nLINUX=%s\n' "$portable" "$linux" >> "$GITHUB_ENV"

      - name: Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shared-mime-info
          command -v update-mime-database
          command -v update-desktop-database
          command -v desktop-file-validate
          command -v setpriv
          mold --version

      - name: Linux Clippy
        if: matrix.platform == 'linux'
        shell: bash
        run: cargo clippy --all-features --all-targets $PORTABLE $LINUX -- -D warnings

      - name: Linux toolchain
        if: matrix.platform == 'linux'
        run: cargo xtask toolchain build

      - name: Linux and portable tests
        if: matrix.platform == 'linux'
        shell: bash
        run: cargo nextest run --all-features $PORTABLE $LINUX

      - name: Privileged Linux tests
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          test_binary="$(cargo test -p zup-linux --features test-support --test machine_root --no-run --message-format=json | python3 -c 'import json,sys; print(next(item["executable"] for line in sys.stdin if (item := json.loads(line)).get("reason") == "compiler-artifact" and item.get("target", {}).get("name") == "machine_root" and item.get("executable")))')"
          test -x "$test_binary"
          sudo "$test_binary" --nocapture

      - name: Public Linux installer E2E
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/zup-public-linux /tmp/zup-public-home /tmp/zup-public-state
          mkdir -p /tmp/zup-public-linux/dist /tmp/zup-public-home /tmp/zup-public-state

          cat > /tmp/zup-public-linux/zup.toml <<'EOF'
          schema = 1

          [app]
          id = "com.example.tool"
          name = "Tool"
          version = "1.0.0"
          icon = "icon.svg"

          [build]

          [build.targets.linux]
          target = "x86_64-unknown-linux-gnu"
          frontend = "console"
          source = { directory = "dist" }

          [install]
          scope = "user"

          [install.directory]
          user = "${location.programs}/tool"

          [[files]]
          source = "tool"
          destination = "${install}"
          executable = true

          [[files]]
          source = "keep.dat"
          destination = "${install}"

          [[launchers]]
          location = "menu"
          name = "Tool"
          target = "${install}/tool"

          [[protocols]]
          scheme = "tool"
          executable = "${install}/tool"
          args = ["--url", "%1"]

          [[file_associations]]
          extension = ".tool"
          id = "example.tool"
          description = "Tool document"
          executable = "${install}/tool"
          EOF

          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "tool 1.0.0"; exit 0; fi\nif [ "$1" = "--url" ]; then echo "opened $2"; exit 0; fi\nexit 1\n' > /tmp/zup-public-linux/dist/tool
          printf 'keep-v1' > /tmp/zup-public-linux/dist/keep.dat
          printf '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#00ff00"/></svg>' > /tmp/zup-public-linux/icon.svg

          cargo run -p zup -- check --manifest /tmp/zup-public-linux/zup.toml --target linux
          cargo run -p zup -- doctor --manifest /tmp/zup-public-linux/zup.toml --target linux
          cargo run -p zup -- build --manifest /tmp/zup-public-linux/zup.toml --target linux

          file /tmp/zup-public-linux/Tool-Setup | grep ELF
          test -x /tmp/zup-public-linux/Tool-Setup
          grep -q x86_64-unknown-linux-gnu /tmp/zup-public-linux/zup-release.json
          test "$(grep -c '\.exe' /tmp/zup-public-linux/zup-release.json || true)" = "0"

          export HOME=/tmp/zup-public-home
          export XDG_DATA_HOME=/tmp/zup-public-home/.local/share
          export XDG_STATE_HOME=/tmp/zup-public-home/.local/state
          export XDG_CONFIG_HOME=/tmp/zup-public-home/.config
          export XDG_CACHE_HOME=/tmp/zup-public-home/.cache
          export XDG_RUNTIME_DIR=/tmp/zup-public-home/run

          mkdir -p "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"

          /tmp/zup-public-linux/Tool-Setup --state-root /tmp/zup-public-state
          /tmp/zup-public-home/.local/lib/zup/apps/tool/tool --version | grep 'tool 1.0.0'

          test -f "$XDG_DATA_HOME/applications/com.example.tool.desktop"
          grep -q '^Type=Application$' "$XDG_DATA_HOME/applications/com.example.tool.desktop"
          grep -q '^Name=Tool$' "$XDG_DATA_HOME/applications/com.example.tool.desktop"
          grep -q 'x-scheme-handler/tool' "$XDG_DATA_HOME/applications/com.example.tool-uri.desktop"
          grep -q 'application/x-com.example.tool-tool' "$XDG_DATA_HOME/applications/com.example.tool-files.desktop"
          test -f "$XDG_DATA_HOME/mime/packages/com.example.tool.xml"
          grep -q 'application/x-com.example.tool-tool' "$XDG_DATA_HOME/mime/globs2"
          test -f "$XDG_DATA_HOME/icons/hicolor/48x48/apps/com.example.tool.png"
          test -f "$XDG_DATA_HOME/icons/hicolor/scalable/apps/com.example.tool.svg"

          desktop-file-validate "$XDG_DATA_HOME/applications/com.example.tool.desktop"
          desktop-file-validate "$XDG_DATA_HOME/applications/com.example.tool-uri.desktop"
          desktop-file-validate "$XDG_DATA_HOME/applications/com.example.tool-files.desktop"

          /tmp/zup-public-home/.local/lib/zup/apps/tool/tool --url tool:hello | grep 'opened tool:hello'

          /tmp/zup-public-linux/Tool-Setup uninstall --state-root /tmp/zup-public-state

          test ! -e /tmp/zup-public-home/.local/lib/zup/apps/tool/tool
          test ! -e "$XDG_DATA_HOME/applications/com.example.tool.desktop"
          test ! -e "$XDG_DATA_HOME/applications/com.example.tool-uri.desktop"
          test ! -e "$XDG_DATA_HOME/applications/com.example.tool-files.desktop"
          test ! -e "$XDG_DATA_HOME/mime/packages/com.example.tool.xml"
          test ! -e "$XDG_DATA_HOME/icons/hicolor/48x48/apps/com.example.tool.png"

          rm -rf /tmp/zup-public-machine
          mkdir -p /tmp/zup-public-machine/dist

          cat > /tmp/zup-public-machine/zup.toml <<'EOF'
          schema = 1

          [app]
          id = "com.example.tool"
          name = "Tool"
          version = "1.0.0"

          [build]

          [build.targets.linux]
          target = "x86_64-unknown-linux-gnu"
          frontend = "console"
          source = { directory = "dist" }

          [install]
          scope = "machine"

          [install.directory]
          machine = "${location.programs}/tool"

          [[files]]
          source = "tool"
          destination = "${install}"
          executable = true
          EOF

          printf '#!/bin/sh\necho "tool 1.0.0"\n' > /tmp/zup-public-machine/dist/tool

          cargo run -p zup -- check --manifest /tmp/zup-public-machine/zup.toml --target linux
          cargo run -p zup -- doctor --manifest /tmp/zup-public-machine/zup.toml --target linux
          cargo run -p zup -- build --manifest /tmp/zup-public-machine/zup.toml --target linux

          file /tmp/zup-public-machine/Tool-Setup | grep ELF
          test -x /tmp/zup-public-machine/Tool-Setup
          grep -q x86_64-unknown-linux-gnu /tmp/zup-public-machine/zup-release.json

      - name: Linux doc tests
        if: matrix.platform == 'linux'
        shell: bash
        run: cargo test --doc --all-features $PORTABLE $LINUX
