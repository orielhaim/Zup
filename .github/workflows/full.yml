name: Full Verification

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      sdk:
        description: Verify generated SDK projects
        type: boolean
        default: false
      release:
        description: Package and verify release material
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1

jobs:
  test:
    name: integration ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-${{ runner.os }}-${{ runner.arch }}-debug0
          cache-on-failure: true

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
        with:
          platform: win64

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
        with:
          mold-version: 3.0.0
          make-default: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shared-mime-info pkg-config libfontconfig1-dev libfreetype-dev libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev

      - name: Linux native service lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/nextest/systemd
          cargo nextest list -p zup-linux --all-features --test services_systemd --list-type binaries-only --message-format json > "$RUNNER_TEMP/systemd-binaries.json"
          cargo metadata --all-features --format-version 1 > "$RUNNER_TEMP/systemd-cargo.json"
          sudo env ZUP_TEST_REAL_SYSTEMD=1 \
            "$(command -v cargo-nextest)" nextest run --profile systemd --no-fail-fast \
            --cargo-metadata "$RUNNER_TEMP/systemd-cargo.json" \
            --binaries-metadata "$RUNNER_TEMP/systemd-binaries.json"

      - name: Toolchain
        run: cargo xtask toolchain build

      - name: Build version-matched plugin test fixtures
        run: |
          rustup target add wasm32-unknown-unknown
          cargo xtask fixtures build

      - name: Windows tests
        if: runner.os == 'Windows'
        run: cargo nextest run --profile integration -p zup -p zup-installer -p zup-preview -p zup-windows --all-features --no-fail-fast

      - name: Linux native installer service lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p zup
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          sudo python3 scripts/verify-systemd-service.py \
            --zup "$PWD/target/debug/zup" \
            --runtime "$PWD/target/debug/toolchain/$version/zup-setup-headless-linux-x64" \
            --plugin "$PWD/target/test-fixtures/configure.wasm"

      - name: Windows native SCM lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-services.ps1

      - name: Linux tests
        if: runner.os == 'Linux'
        shell: bash
        run: cargo nextest run --profile integration -p zup -p zup-installer -p zup-preview -p zup-linux --all-features --no-fail-fast

      - name: Generated SDK projects
        if: inputs.sdk == true
        run: cargo nextest run -p zup --all-features --test generated_projects --no-fail-fast

      - name: Test failure diagnostics
        if: always()
        run: python scripts/ci/report-tests.py

      - name: Build reusable tooling
        run: cargo build -p zup -p zup-xtask --bins

      - name: Archive reusable tooling
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          tar -cf "tooling-${{ runner.os == 'Windows' && 'windows' || 'linux' }}.tar" -C target/debug "zup$suffix" "xtask$suffix"

      - name: Upload reusable tooling
        uses: actions/upload-artifact@v7
        with:
          name: tooling-${{ runner.os == 'Windows' && 'windows' || 'linux' }}.tar
          path: tooling-${{ runner.os == 'Windows' && 'windows' || 'linux' }}.tar
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Upload staged toolchain
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          path: target/debug/toolchain
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  cross-build-windows:
    name: Compose Linux on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: tooling-windows.tar
          path: tools

      - name: Restore reusable tooling
        shell: bash
        run: |
          mkdir -p tooling
          tar -xf tools/tooling-windows.tar -C tooling

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-windows
          path: tc-win

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-linux
          path: tc-linux

      - name: Merge toolchains
        shell: pwsh
        run: |
          tooling/xtask.exe toolchain assemble --source tc-win --source tc-linux --out merged

      - name: Compose the foreign Linux installer
        shell: pwsh
        run: |
          tooling/zup.exe --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target linux-x64 --output dist/lnx.bin --force
          if ($LASTEXITCODE -ne 0) { throw 'Linux composition failed' }
          tooling/zup.exe artifact inspect dist/lnx.bin
          if ($LASTEXITCODE -ne 0) { throw 'Linux artifact inspection failed' }

      - uses: actions/upload-artifact@v7
        with:
          name: installer-linux-from-windows
          path: dist/lnx.bin
          if-no-files-found: error

  cross-build-linux:
    name: Compose Universal Windows on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: tooling-linux.tar
          path: tools

      - name: Restore reusable tooling
        shell: bash
        run: |
          mkdir -p tooling
          tar -xf tools/tooling-linux.tar -C tooling

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-windows
          path: tc-win

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-linux
          path: tc-linux

      - name: Merge toolchains
        shell: bash
        run: |
          set -euo pipefail
          tooling/xtask toolchain assemble --source tc-win --source tc-linux --out merged
          mkdir -p dist

      - name: Compose the foreign Universal installer
        shell: bash
        run: |
          set -euo pipefail
          tooling/zup --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target windows-x64 --universal --output dist/uni.exe --force --release-manifest none
          tooling/zup artifact inspect dist/uni.exe

      - name: Upload the cross-built Universal installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-universal-from-linux
          path: dist/uni.exe
          if-no-files-found: error

  cross-e2e-windows:
    name: Run the Linux-built Universal installer
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [cross-build-linux]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: installer-universal-from-linux
          path: foreign

      - name: Lifecycle of the foreign-built Universal installer
        shell: pwsh
        run: scripts/ci/e2e-windows.ps1 -Installer foreign/uni.exe

  cross-e2e-linux:
    name: Run the Windows-built Linux installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [cross-build-windows]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: installer-linux-from-windows
          path: foreign

      - name: Lifecycle of the foreign-built Linux installer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x foreign/lnx.bin
          sh scripts/ci/e2e-linux.sh foreign/lnx.bin

  release:
    if: inputs.release == true
    name: release material
    runs-on: windows-latest
    timeout-minutes: 180
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: tooling-windows.tar
          path: tools

      - name: Restore reusable tooling
        shell: bash
        run: |
          mkdir -p tooling
          tar -xf tools/tooling-windows.tar -C tooling

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-windows
          path: tc-win

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-linux
          path: tc-linux

      - name: Merge and package the multi-platform release
        shell: pwsh
        run: |
          tooling/xtask.exe toolchain package --cli tooling/zup.exe --profile dev --source tc-win --source tc-linux

      - name: Release clean-room
        shell: pwsh
        run: tooling/xtask.exe release clean-room

      - name: Published schema
        shell: pwsh
        run: |
          tooling/zup.exe schema --output schema/zup.schema.json
          git diff --exit-code -- schema/zup.schema.json
