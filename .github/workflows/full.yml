name: Full Verification
run-name: ${{ inputs.native_windows_runner && inputs.native_windows_runner != 'none' && format('Native Windows verification ({0})', inputs.native_windows_runner) || inputs.measure_sizes && 'Installer size measurements' || 'Full Verification' }}

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      native_windows_runner:
        description: Run focused native Windows validation instead of Full Verification
        type: choice
        default: none
        options: [none, windows-latest, windows-11-arm]
      test_filter:
        description: Nextest expression for focused native Windows validation
        type: string
        default: all()
      measure_sizes:
        description: Measure native installers instead of running full verification
        type: boolean
        default: false
      revision:
        description: Optional revision to measure
        type: string
      profile:
        description: Cargo profile for size measurements
        type: string
        default: installer
      size_runner:
        description: Native runner for size measurements
        type: choice
        default: all
        options:
          [all, ubuntu-latest, ubuntu-26.04-arm, windows-latest, windows-11-arm]

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}-${{ inputs.measure_sizes && format('sizes-{0}-{1}-{2}', inputs.profile, inputs.revision, inputs.size_runner) || inputs.native_windows_runner && inputs.native_windows_runner != 'none' && format('native-{0}', inputs.native_windows_runner) || 'verification' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1

jobs:
  native-windows:
    name: Native Windows verification
    if: inputs.native_windows_runner && inputs.native_windows_runner != 'none'
    runs-on: ${{ inputs.native_windows_runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-${{ runner.os }}-${{ runner.arch }}-debug0
          cache-on-failure: false
      - uses: ilammy/setup-nasm@v1
        with:
          platform: win64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Toolchain
        run: cargo xtask toolchain build
      - name: Selected native tests
        shell: pwsh
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: cargo nextest run -p zup -p zup-installer -p zup-windows -p zup-plugin-runtime --all-features --no-fail-fast -E "$env:TEST_FILTER"
      - name: Machine authority tests
        run: cargo nextest run -p zup-windows --all-features --run-ignored ignored-only --no-fail-fast -E 'test(machine_fs::tests) | test(machine_authority::tests) | test(machine_runtime_)'

  sizes:
    name: Installer sizes (${{ matrix.os }})
    if: inputs.measure_sizes == true && (!inputs.native_windows_runner || inputs.native_windows_runner == 'none')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.size_runner == 'all' && '["ubuntu-latest", "ubuntu-26.04-arm", "windows-latest", "windows-11-arm"]' || format('["{0}"]', inputs.size_runner)) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preserve the measurement tool
        shell: bash
        run: cp scripts/ci/installer-size.py "$RUNNER_TEMP/installer-size.py"

      - uses: actions/checkout@v7
        if: inputs.revision != ''
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sizes-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
        with:
          platform: win64

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev mold

      - name: Build native toolchain and developer CLI
        shell: bash
        env:
          SIZE_PROFILE: ${{ inputs.profile }}
        run: |
          cargo xtask toolchain build --profile "$SIZE_PROFILE"
          cargo build -p zup --bin zup

      - name: Measure composed installers
        shell: bash
        env:
          SIZE_PROFILE: ${{ inputs.profile }}
        run: |
          directory="$SIZE_PROFILE"
          if [ "$directory" = dev ]; then directory=debug; fi
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          python "$RUNNER_TEMP/installer-size.py" --cli "target/debug/zup$suffix" --toolchain "target/$directory/toolchain/0.0.1" --output target/sizes
          python - <<'PYREPORT'
          import json
          from pathlib import Path
          for row in json.loads(Path("target/sizes/sizes.json").read_text())["measurements"]:
              print("::notice title=Installer size::" + json.dumps(row))
          PYREPORT

      - name: Windows runtime link map
        if: runner.os == 'Windows' && inputs.profile == 'installer'
        shell: pwsh
        run: |
          $map = Join-Path $env:GITHUB_WORKSPACE 'target/runtime.map'
          cargo rustc -p zup-installer --no-default-features --features headless --bin zup-setup-headless --profile installer -- -C "link-arg=/MAP:$map"
          if ($LASTEXITCODE -ne 0) { throw 'runtime link map failed' }

      - uses: actions/upload-artifact@v7
        with:
          name: sizes-${{ matrix.os }}-${{ inputs.profile }}
          path: |
            target/sizes/sizes.json
            target/sizes/*/inspection.json
            target/runtime.map
          if-no-files-found: error

  test:
    name: full test ${{ matrix.os }}
    if: inputs.measure_sizes != true && (!inputs.native_windows_runner || inputs.native_windows_runner == 'none')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-${{ runner.os }}-${{ runner.arch }}-debug0
          cache-on-failure: false

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
        with:
          platform: win64

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
        with:
          mold-version: 3.0.0
          make-default: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Linux package selection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          portable="$(cargo xtask emit-host-packages --host any --format cargo-args)"
          linux="$(cargo xtask emit-host-packages --host linux --format cargo-args)"
          printf 'PORTABLE=%s\nLINUX=%s\n' "$portable" "$linux" >> "$GITHUB_ENV"

      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shared-mime-info pkg-config libfontconfig1-dev libfreetype-dev libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev

      - name: Linux native service lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" \
            ZUP_TEST_REAL_SYSTEMD=1 CARGO_INCREMENTAL=0 \
            cargo nextest run -p zup-linux --all-features --test services_systemd --no-fail-fast

      - name: Toolchain
        run: cargo xtask toolchain build

      - name: Windows tests
        if: runner.os == 'Windows'
        run: cargo nextest run --workspace --all-features --no-fail-fast

      - name: Windows machine authority tests
        if: runner.os == 'Windows'
        run: cargo nextest run -p zup-windows --all-features --run-ignored ignored-only --no-fail-fast -E 'test(machine_fs::tests) | test(machine_authority::tests) | test(machine_runtime_)'

      - name: Linux tests
        if: runner.os == 'Linux'
        shell: bash
        run: cargo nextest run --all-features --no-fail-fast $PORTABLE $LINUX

      - name: Build reusable tooling
        if: runner.arch == 'X64'
        run: cargo build -p zup -p zup-xtask --bins

      - name: Archive reusable tooling
        if: runner.arch == 'X64'
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          tar -cf "tooling-${{ runner.os == 'Windows' && 'windows' || 'linux' }}.tar" -C target/debug "zup$suffix" "xtask$suffix"

      - name: Upload reusable tooling
        if: runner.arch == 'X64'
        uses: actions/upload-artifact@v7
        with:
          name: tooling-${{ runner.os == 'Windows' && 'windows' || 'linux' }}.tar
          path: tooling-${{ runner.os == 'Windows' && 'windows' || 'linux' }}.tar
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Upload staged toolchain
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-${{ runner.os == 'Windows' && 'windows' || 'linux' }}${{ runner.arch == 'ARM64' && '-arm64' || '' }}
          path: target/debug/toolchain
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  cross-build-windows:
    name: Build both targets on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: tooling-windows.tar
          path: tools

      - name: Restore reusable tooling
        shell: bash
        run: |
          mkdir -p tooling
          tar -xf tools/tooling-windows.tar -C tooling

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-windows
          path: tc-win

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-linux
          path: tc-linux

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-linux-arm64
          path: tc-arm64

      - name: Merge both toolchains
        shell: pwsh
        run: |
          tooling/xtask.exe toolchain assemble --source tc-win --source tc-linux --source tc-arm64 --out merged

      - name: Build every fixture target
        shell: pwsh
        run: |
          $zup = 'tooling/zup.exe'
          & $zup --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target windows-x64 --output dist/win.exe --force
          & $zup --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target linux-x64 --output dist/lnx.bin --force
          & $zup --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target linux-arm64 --output dist/arm64.bin --force
          & $zup --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target windows-x64 --universal --output dist/uni.exe --force --release-manifest none

      - name: Verify every artifact
        shell: pwsh
        run: |
          $zup = 'tooling/zup.exe'
          foreach ($artifact in @('dist/win.exe', 'dist/lnx.bin', 'dist/arm64.bin', 'dist/uni.exe')) {
            & $zup artifact inspect $artifact | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "inspect of $artifact failed" }
          }

      - name: Lifecycle of the native Windows installer
        shell: pwsh
        run: scripts/ci/e2e-windows.ps1 -Installer dist/win.exe

      - name: Lifecycle of the Universal installer
        shell: pwsh
        run: scripts/ci/e2e-windows.ps1 -Installer dist/uni.exe

      - name: Upload the cross-built Linux installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-linux-from-windows
          path: dist/lnx.bin
          if-no-files-found: error

      - name: Upload the cross-built ARM64 installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-arm64-from-windows
          path: dist/arm64.bin
          if-no-files-found: error

  cross-build-linux:
    name: Build both targets on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: tooling-linux.tar
          path: tools

      - name: Restore reusable tooling
        shell: bash
        run: |
          mkdir -p tooling
          tar -xf tools/tooling-linux.tar -C tooling

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-windows
          path: tc-win

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-linux
          path: tc-linux

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-linux-arm64
          path: tc-arm64

      - name: Merge both toolchains
        shell: bash
        run: |
          set -euo pipefail
          tooling/xtask toolchain assemble --source tc-win --source tc-linux --source tc-arm64 --out merged
          mkdir -p dist

      - name: Build every fixture target
        shell: bash
        run: |
          set -euo pipefail
          zup=tooling/zup
          $zup --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target windows-x64 --output dist/win.exe --force
          $zup --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target linux-x64 --output dist/lnx.bin --force
          $zup --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target linux-arm64 --output dist/arm64.bin --force
          $zup --toolchain merged build --manifest fixtures/cross-matrix/zup.toml --target windows-x64 --universal --output dist/uni.exe --force --release-manifest none

      - name: Verify every artifact
        shell: bash
        run: |
          set -euo pipefail
          zup=tooling/zup
          for artifact in dist/win.exe dist/lnx.bin dist/arm64.bin dist/uni.exe; do
            $zup artifact inspect "$artifact" > /dev/null
          done

      - name: Lifecycle of the native Linux installer
        shell: bash
        run: sh scripts/ci/e2e-linux.sh dist/lnx.bin

      - name: Upload the cross-built Universal installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-universal-from-linux
          path: dist/uni.exe
          if-no-files-found: error

  cross-e2e-windows:
    name: Run the Linux-built Universal installer
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [cross-build-linux]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: installer-universal-from-linux
          path: foreign

      - name: Lifecycle of the foreign-built Universal installer
        shell: pwsh
        run: scripts/ci/e2e-windows.ps1 -Installer foreign/uni.exe

  cross-e2e-linux:
    name: Run the Windows-built Linux installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [cross-build-windows]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: installer-linux-from-windows
          path: foreign

      - name: Lifecycle of the foreign-built Linux installer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x foreign/lnx.bin
          sh scripts/ci/e2e-linux.sh foreign/lnx.bin

  cross-e2e-arm64:
    name: Run the Windows-built ARM64 installer
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    needs: [cross-build-windows]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: installer-arm64-from-windows
          path: foreign
      - name: Native ARM64 lifecycle
        run: |
          chmod +x foreign/arm64.bin
          sh scripts/ci/e2e-linux.sh foreign/arm64.bin

  release:
    name: release material
    runs-on: windows-latest
    timeout-minutes: 180
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: tooling-windows.tar
          path: tools

      - name: Restore reusable tooling
        shell: bash
        run: |
          mkdir -p tooling
          tar -xf tools/tooling-windows.tar -C tooling

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-windows
          path: tc-win

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-linux
          path: tc-linux

      - uses: actions/download-artifact@v8
        with:
          name: toolchain-linux-arm64
          path: tc-arm64

      - name: Merge and package the multi-platform release
        shell: pwsh
        run: |
          tooling/xtask.exe toolchain package --cli tooling/zup.exe --profile dev --source tc-win --source tc-linux --source tc-arm64

      - name: Release clean-room
        shell: pwsh
        run: tooling/xtask.exe release clean-room

      - name: Published schema
        shell: pwsh
        run: |
          tooling/zup.exe schema --output schema/zup.schema.json
          git diff --exit-code -- schema/zup.schema.json
