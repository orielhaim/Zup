name: Verification diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  diagnose:
    name: diagnose ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-${{ runner.os }}
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
        with:
          mold-version: 3.0.0
          make-default: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shared-mime-info pkg-config libfontconfig1-dev libfreetype-dev libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
      - name: Linux native service lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" \
            ZUP_TEST_REAL_SYSTEMD=1 CARGO_INCREMENTAL=0 \
            cargo nextest run -p zup-linux --all-features --test services_systemd --no-fail-fast \
            > "$RUNNER_TEMP/diagnostic.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/diagnostic.log"
          exit "$status"
      - name: Windows ARM64 toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & cargo xtask toolchain build *> "$env:RUNNER_TEMP/diagnostic.log"
          $status = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/diagnostic.log"
          exit $status
      - name: Emit failure output
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "diagnostic.log"
          if log.is_file():
              text = log.read_bytes()[-12000:].decode("utf-8", errors="replace")
              for offset in range(0, len(text), 3000):
                  chunk = text[offset:offset + 3000]
                  chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Native diagnostic part {offset // 3000 + 1}::{chunk}")
