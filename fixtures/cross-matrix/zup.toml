#:schema https://zup.dev/schema/zup.toml.json
#
# CI composes Linux on Windows and Universal Windows on Linux, then runs
# each installer's lifecycle on its target host. Other targets remain available
# for local cross-build checks.
#
# Nothing here is special: one payload file, user scope, no services, no
# launchers or custom preset settings.

schema = 1

[app]
id = "com.example.crossmatrix"
name = "Cross Matrix"
version = "1.0.0"
publisher = "Example Software"
description = "A minimal application for the cross-build matrix."

[build]

[build.targets.windows-x64]
source = { directory = "payload" }
frontend = "console"

[build.targets.linux-x64]
source = { directory = "payload" }
frontend = "console"

[build.targets.linux-arm64]
source = { directory = "payload" }
frontend = "console"

[install]
scope = "user"

[install.directory]
user = "${location.user_data}/Cross Matrix"

[[files]]
source = "**/*"
destination = "${install}"
