[package]
name = "aurora"
version = "1.4.2"
edition = "2024"
description = "A drawing program, used to exercise the preset package pipeline"
publish = false

[lib]
name = "aurora"
path = "src/lib.rs"

[[bin]]
name = "aurora-preset"
path = "src/main.rs"

# The whole of what a preset needs. `serde` and `schemars` are absent on purpose:
# the schema that validates an application's settings is generated by the SDK
# this preset already depends on, so a second copy of either would be a second
# schema.
[dependencies]
zup-sdk = { version = "0.1.0", path = "../../crates/zup-sdk", features = ["preset"] }